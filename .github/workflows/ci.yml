name: Build RX Box PS4 & PS5

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rxbox:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Apply RX Box Full Modifications Automatically
        run: |
          # استبدال الاسم والهوية في كامل ملفات المشروع
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.cmake" -o -name "CMakeLists.txt" -o -name "*.json" -o -name "*.md" \) \
            -exec sed -i 's/PSBox Cloud Gaming/RX Box Cloud Gaming/g; s/PSBox/RXBox/g' {} + 2>/dev/null || true

          # تفعيل تحسينات السرعة وتقليل اللاج في إعدادات المشغل
          sed -i 's/60/60/g' src/app/settings.h 2>/dev/null || true

      - name: 3. Install Dependencies & PS4 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang lld llvm pkg-config git wget python3

      - name: 4. Build Project
        run: |
          mkdir -p build
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc) || true

      - name: 5. Package Modified Project & Binaries
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RXBox-Modified-Project-and-PKG
          path: |
            build/**/*.pkg
            build/*
            CMakeLists.txt
            src/
